name: Godot
on: [release]
jobs:
  Build-Exporter:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ./docs/docker
          file: ./docs/docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/godot:4.7.2
  Release-Windows-Desktop-x86_64:
    needs: Build-Exporter
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: >
          docker run --rm -v "${{ github.workspace }}:/project" -w /project "ghcr.io/${{ github.repository_owner }}/godot:4.7.2"
          godot --headless --export-release "Windows Desktop" ./exports/Twitch-Chat-Reactions.exe
      - uses: actions/upload-artifact@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release-Windows-Desktop-x86_64
          path: ./exports/Twitch-Chat-Reactions.exe
